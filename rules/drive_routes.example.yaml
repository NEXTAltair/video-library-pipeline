# Illustrative paths only; customize and explicitly configure driveRoutesPath.
default_dest: "C:\\VideoLibrary"
default_layout: by_program_year_month
# Optional: single films grouped by broadcast frame, series by explicit work list.
# movie_grouping_path: movie_grouping.example.yaml
# Optional exact-work storage override, independent of genre/movie framing.
# work_routes:
#   - works: [Example Work]
#     dest_root: "C:\\VideoLibrary\\Example Series"
#     layout: by_title
routes:
  - genre: anime
    dest_root: "C:\\VideoLibrary\\Anime"
    layout: by_title
    epg_genre_match: ["アニメ/特撮 - *"]
    title_patterns: []
  - genre: movie
    dest_root: "C:\\VideoLibrary\\Movies"
    layout: by_title
    epg_genre_match: ["映画 - *"]
    title_patterns: []
  - genre: documentary
    dest_root: "C:\\VideoLibrary\\Documentary"
    # Year/month folders suit daily/weekly shows; self-contained documentaries
    # go straight under the program folder. Listed programs win over EPG.
    layout: by_program_year_month
    epg_genre_match: ["ドキュメンタリー/教養 - *", "情報/ワイドショー - *"]
    layout_rules:
      - layout: by_title
        programs: ["Example Documentary"]
        epg_genre_match: ["ドキュメンタリー/教養 - *"]
      - layout: by_program_year_month
        programs: ["Example Morning Show"]
    title_patterns: []
