# Optional policy: movie_grouping_path: movie_grouping.example.yaml in drive routes.
# Work identity is retained in metadata. This file selects storage groups only.
# Single films use their broadcast-frame folder. Series use explicit work lists.
# Inside a series folder a leading "<abbr>#<number>" (e.g. ゴジラ#03, レジェゴジ＃01) is the owner's
# series order: relocate skips it when checking titles, reports series_abbr/series_order
# in plan rows, and keeps the file name unchanged. Outside series folders #03 stays an episode marker.
version: 1
default_dest_root: 'C:\VideoLibrary\Movies'
frames: [金曜ロードショー, 日曜アニメ劇場, 日曜ゴジラ劇場, 日曜邦画劇場]
series:
  - folder: シリーズ_ガンダム
    dest_root: 'C:\VideoLibrary\Anime'
    works:
      - 機動戦士ガンダムIII めぐりあい宇宙編
      - 機動戦士ガンダム ククルス・ドアンの島
      - title: 機動戦士Zガンダム A New Translation II 恋人たち
        aliases: [機動戦士Ζガンダム A New Translation II 恋人たち]
      - title: 機動戦士Zガンダム A New Translation III 星の鼓動は愛
        aliases: [機動戦士Ζガンダム A New Translation III 星の鼓動は愛]
      - 機動戦士ガンダムUC
  - folder: シリーズ_ゴジラ+モンスターバース
    dest_root: 'C:\VideoLibrary\Tokusatsu'
    # Optional: by_work = <series>\<work folder>\<file> (films); by_work_year_month adds <YYYY>\<MM>.
    # Default "flat" keeps files in the series root.
    work_layout: by_work_year_month
    works:
      - ゴジラ-1.0
      - ゴジラ-1.0/C            # folder: ゴジラ-1.0＿C (forbidden characters become ＿)
      - title: ゴジラxコング 新たなる帝国
        aliases: [ゴジラxコング]
        folder: ゴジラxコング   # match a folder that already exists
      - キングコング対ゴジラ
      - title: ゴジラ2000 ―ミレニアム―
        aliases: [ゴジラ2000　―ミレニアム―]
      - ゴジラ(1984年)
  - folder: シリーズ_インディ・ジョーンズ
    dest_root: 'C:\VideoLibrary\Movies'
    works:
      - インディ・ジョーンズ/最後の聖戦
      - インディ・ジョーンズ/クリスタル・スカルの王国
